# Ambiente do trabalho: Neo4j (banco de grafos) + SQL Server opcional (comparativo)
#
# Subir só o Neo4j:           docker compose up -d
# Subir também o SQL Server:  docker compose --profile comparativo up -d
# Derrubar (mantém dados):    docker compose down
# Derrubar e apagar dados:    docker compose down -v

services:
  neo4j:
    image: neo4j:5
    container_name: neo4j-rede-academica
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # protocolo Bolt (cypher-shell, drivers)
    environment:
      NEO4J_AUTH: neo4j/senha12345   # usuário/senha (senha com no mínimo 8 caracteres)
    volumes:
      - neo4j_data:/data
      - ./cypher:/scripts:ro        # scripts acessíveis dentro do container em /scripts
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p senha12345 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Opcional: o mesmo caso em banco relacional (SQL Server), para o comparativo.
  # Os scripts ficam em /sql dentro do container (passo a passo no README, seção 7).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-comparativo
    profiles: ["comparativo"]
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Senha@12345"   # o SQL Server exige senha forte
    volumes:
      - ./sql:/sql:ro

volumes:
  neo4j_data:
